<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Task - TaskManager</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <nav>
        <h1>TaskManager</h1>
        <ul>
            <li><a href="index.html">Dashboard</a></li>
            <li><a href="task-list.html">Task List</a></li>
            <li><a href="add-task.html" class="active">Add Task</a></li>
            <li><a href="about.html">About Us</a></li>
        </ul>
    </nav>

    <main>
        <header>
            <h2>Create New Task</h2>
            <p>Assigned by: Muhammad Bilal</p>
        </header>

        <div class="card" style="max-width: 600px;">
            <form action="task-list.html" method="GET">
                <div class="form-group">
                    <label for="taskTitle">Task Title</label>
                    <input type="text" id="taskTitle" class="form-control" placeholder="e.g., Fix Navigation Bug" required>
                </div>

                <div class="form-group">
                    <label for="taskDesc">Description</label>
                    <textarea id="taskDesc" class="form-control" rows="4" placeholder="Describe the task specifications..."></textarea>
                </div>

                <div class="form-group">
                    <label for="assignee">Assignee</label>
                    <select id="assignee" class="form-control">
                        <option>Abu Hurara</option>
                        <option>Muhammad Bilal</option>
                        <option>Abdullah Ikram</option>
                        <option>Abu Bakar</option>
                        <option>Noman Khan</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="priority">Priority Level</label>
                    <select id="priority" class="form-control">
                        <option value="low">Low</option>
                        <option value="medium">Medium</option>
                        <option value="high">High</option>
                    </select>
                </div>

                <div style="display: flex; gap: 1rem; margin-top: 1.5rem;">
                    <button type="submit" class="btn btn-primary">Save Task</button>
                    <a href="task-list.html" class="btn btn-secondary">Cancel</a>
                </div>
            </form>
        </div>
    </main>

</body>
</html>
